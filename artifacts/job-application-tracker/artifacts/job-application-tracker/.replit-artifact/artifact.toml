kind = "web"
previewPath = "/"
title = "Job Application Tracker"
version = "1.0.0"
id = "artifacts/job-application-tracker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19903

[services.development]
run = "pnpm --filter @workspace/job-application-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/job-application-tracker", "run", "build" ]
publicDir = "artifacts/job-application-tracker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19903"
BASE_PATH = "/"
